name: release

# Builds ready-to-install downloads and attaches them to a GitHub Release, so
# nobody has to compile the app to use it:
#
#   Marsa-macos.dmg              drag to Applications
#   Marsa-windows-setup.exe      installer
#   Marsa-windows-portable.zip   unzip and run, no install
#
# Runs when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0)
# or when started by hand from the Actions tab (builds only, no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The version the app is developed and tested with, so a new Flutter
  # release cannot break a tagged build with new lints or API changes.
  FLUTTER_VERSION: 3.44.1

jobs:
  test:
    # macOS because the end-to-end tests start the system's own sshd.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cloud drive app keys
        # Identify Marsa to Dropbox and Google Drive. Without the secrets the
        # file holds empty values and the build simply hides those options.
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf '{"DROPBOX_APP_KEY":"%s","GOOGLE_CLIENT_ID":"%s","GOOGLE_CLIENT_SECRET":"%s"}\n' \
            "$DROPBOX_APP_KEY" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > cloud_keys.json
      - run: flutter build windows --release --dart-define-from-file=cloud_keys.json
      - name: Bundle the Visual C++ runtime
        # Flutter apps need these three DLLs; shipping them beside the exe
        # means the app also starts on a PC that never installed the runtime.
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" build\windows\x64\runner\Release\
          }
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Marsa-windows-portable.zip
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Marsa-windows-setup.exe
            dist/Marsa-windows-portable.zip
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    # Signing and notarisation happen only when these repository secrets
    # exist (see docs/signing.md); without them the build is unsigned.
    env:
      P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cloud drive app keys
        # Identify Marsa to Dropbox and Google Drive. Without the secrets the
        # file holds empty values and the build simply hides those options.
        shell: bash
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf '{"DROPBOX_APP_KEY":"%s","GOOGLE_CLIENT_ID":"%s","GOOGLE_CLIENT_SECRET":"%s"}\n' \
            "$DROPBOX_APP_KEY" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > cloud_keys.json
      - run: flutter build macos --release --dart-define-from-file=cloud_keys.json
      - name: Sign with Developer ID
        if: env.P12_BASE64 != ''
        run: |
          # A throwaway keychain holding the certificate for this job only.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          test -n "$IDENTITY" || { echo "No Developer ID Application certificate in the .p12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Inside out: every framework and library first, then the app with
          # the hardened runtime that notarisation requires.
          APP=build/macos/Build/Products/Release/Marsa.app
          find "$APP/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
            xargs -0 -n1 codesign --force --options runtime --timestamp --sign "$IDENTITY"
          codesign --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Disk image
        run: |
          mkdir -p dist stage
          ditto build/macos/Build/Products/Release/Marsa.app stage/Marsa.app
          ln -s /Applications stage/Applications
          hdiutil create -volname Marsa -srcfolder stage -ov -format UDZO dist/Marsa-macos.dmg
      - name: Notarise
        if: env.P12_BASE64 != ''
        run: |
          codesign --force --timestamp --sign "$SIGN_IDENTITY" dist/Marsa-macos.dmg
          CREDS=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          ID="$(xcrun notarytool submit dist/Marsa-macos.dmg "${CREDS[@]}" --output-format json | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')"
          echo "Submission $ID"
          # Apple can take a long time, and one dropped connection must not
          # throw the wait away: poll, and keep going through errors.
          STATUS=
          for i in $(seq 1 180); do
            STATUS="$(xcrun notarytool info "$ID" "${CREDS[@]}" --output-format json 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])' 2>/dev/null || true)"
            echo "Status: ${STATUS:-unreachable}"
            [ -n "$STATUS" ] && [ "$STATUS" != "In Progress" ] && break
            sleep 30
          done
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${CREDS[@]}" || true
            exit 1
          fi
          # Attach the approval so the app opens without a network check.
          xcrun stapler staple dist/Marsa-macos.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/Marsa-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Marsa-macos.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Marsa-macos.dmg
            Marsa-windows-setup.exe
            Marsa-windows-portable.zip
